name: NOOP Minimal iOS IPA
on:
  push:
    branches: [design/noop-minimal-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild -project Strand.xcodeproj -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/noop-derived" CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA for AltStore signing
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/noop-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d | head -n 1)
          test -n "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/NOOP-Minimal-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NOOP-Minimal-unsigned-IPA
          path: NOOP-Minimal-unsigned.ipa
          if-no-files-found: error
