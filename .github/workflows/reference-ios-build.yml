name: Reference UI iOS build
on:
  workflow_dispatch:
  push:
    branches: [design/reference-ui-redesign]
    paths:
      - 'Strand/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/reference-ios-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build iOS simulator
        run: |
          set -o pipefail
          xcodebuild -project Strand.xcodeproj -scheme NOOPiOS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
